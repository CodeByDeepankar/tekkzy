# serverless.yml
org: deepankar68
app: daily-spend-manager
service: daily-spend-manager

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  environment:
    DYNAMODB_USERS_TABLE: ${self:service}-${sls:stage}-users
    DYNAMODB_CONTACTS_TABLE: ${self:service}-${sls:stage}-contacts
    DYNAMODB_USERS_EMAIL_INDEX: email-index
    S3_BUCKET: ${self:service}-${sls:stage}-uploads-${aws:accountId}
    COGNITO_USER_POOL_ID:
      Ref: CognitoUserPool
    COGNITO_CLIENT_ID:
      Ref: CognitoUserPoolClient
    COGNITO_REGION: ${self:provider.region}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:GetItem
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:DeleteItem
            - dynamodb:UpdateItem
          Resource:
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:service}-${sls:stage}-users
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:service}-${sls:stage}-users/index/email-index
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:service}-${sls:stage}-contacts
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
            - s3:DeleteObject
          Resource:
            - arn:aws:s3:::${self:service}-${sls:stage}-uploads-${aws:accountId}/*
        - Effect: Allow
          Action:
            - cognito-idp:AdminGetUser
            - cognito-idp:AdminCreateUser
            - cognito-idp:AdminDeleteUser
          Resource:
            - Fn::GetAtt: [CognitoUserPool, Arn]

functions:
  api:
    handler: lambda.handler
    events:
      # Root
      - http:
          path: /
          method: GET
          cors: true

      # Auth routes
      - http:
          path: /api/auth/register
          method: POST
          cors: true
      - http:
          path: /api/auth/confirm
          method: POST
          cors: true
      - http:
          path: /api/auth/resend-code
          method: POST
          cors: true
      - http:
          path: /api/auth/login
          method: POST
          cors: true
      - http:
          path: /api/auth/me
          method: GET
          cors: true

      # Contact routes
      - http:
          path: /api/contacts
          method: GET
          cors: true
      - http:
          path: /api/contacts/mine
          method: GET
          cors: true
      - http:
          path: /api/contacts
          method: POST
          cors: true
      - http:
          path: /api/contacts/{id}
          method: PUT
          cors: true
      - http:
          path: /api/contacts/{id}
          method: DELETE
          cors: true

      # Upload routes
      - http:
          path: /api/uploads/presign
          method: POST
          cors: true

plugins:
  - serverless-offline

resources:
  Resources:
    UsersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${sls:stage}-users
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: userId
            AttributeType: S
          - AttributeName: email
            AttributeType: S
        KeySchema:
          - AttributeName: userId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: email-index
            KeySchema:
              - AttributeName: email
                KeyType: HASH
            Projection:
              ProjectionType: ALL

    ContactsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${sls:stage}-contacts
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: contactId
            AttributeType: S
        KeySchema:
          - AttributeName: contactId
            KeyType: HASH

    UploadsBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:service}-${sls:stage}-uploads-${aws:accountId}
        CorsConfiguration:
          CorsRules:
            - AllowedOrigins:
                - '*'
              AllowedHeaders:
                - '*'
              AllowedMethods:
                - PUT
                - POST

    CognitoUserPool:
      Type: AWS::Cognito::UserPool
      Properties:
        UserPoolName: ${self:service}-${sls:stage}-user-pool
        UsernameAttributes:
          - email
        AutoVerifiedAttributes:
          - email
        Policies:
          PasswordPolicy:
            MinimumLength: 8
            RequireLowercase: true
            RequireNumbers: true
            RequireSymbols: false
            RequireUppercase: true
        Schema:
          - Name: name
            AttributeDataType: String
            Mutable: true
            Required: false
          - Name: email
            AttributeDataType: String
            Mutable: false
            Required: true

    CognitoUserPoolClient:
      Type: AWS::Cognito::UserPoolClient
      Properties:
        ClientName: ${self:service}-${sls:stage}-client
        UserPoolId:
          Ref: CognitoUserPool
        GenerateSecret: false
        ExplicitAuthFlows:
          - ALLOW_USER_PASSWORD_AUTH
          - ALLOW_REFRESH_TOKEN_AUTH
          - ALLOW_USER_SRP_AUTH
        PreventUserExistenceErrors: ENABLED
        AccessTokenValidity: 1
        IdTokenValidity: 1
        RefreshTokenValidity: 30
        TokenValidityUnits:
          AccessToken: days
          IdToken: days
          RefreshToken: days

  Outputs:
    CognitoUserPoolId:
      Value:
        Ref: CognitoUserPool
      Export:
        Name: ${self:service}-${sls:stage}-UserPoolId
    CognitoUserPoolClientId:
      Value:
        Ref: CognitoUserPoolClient
      Export:
        Name: ${self:service}-${sls:stage}-UserPoolClientId
